<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Saver — download videos and images</title>
<style>
  :root{
    --paper:#f3efe8; --ink:#1d1a17; --muted:#6f675e; --line:#d9d2c6;
    --accent:#c8102e; --accent-ink:#fff; --card:#fbf9f5;
  }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#17140f; --ink:#f1ece3; --muted:#9a9187; --line:#332e26; --card:#1f1b15; --accent:#e8445b; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font:17px/1.55 "Iowan Old Style","Palatino Linotype",Georgia,serif;}
  main{max-width:640px;margin:0 auto;padding:48px 20px 80px}
  h1{font-size:clamp(2.4rem,9vw,3.6rem);line-height:1;margin:0 0 12px;letter-spacing:-.02em;font-weight:700}
  h1 span{color:var(--accent)}
  .lede{color:var(--muted);margin:0 0 32px;max-width:48ch}
  .row{display:flex;gap:8px}
  input,select{flex:1;min-width:0;padding:14px 16px;font:inherit;font-size:16px;color:var(--ink);
    background:var(--card);border:1.5px solid var(--line);border-radius:10px}
  select{flex:0 1 auto;padding:12px}
  input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  button,.dl{font:600 16px/1 system-ui,sans-serif;padding:14px 20px;border:0;border-radius:10px;
    background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
  button:disabled{opacity:.6;cursor:wait}
  .err{margin-top:16px;color:var(--accent);font-family:system-ui,sans-serif;font-size:15px}
  #result{margin-top:32px;display:none}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px}
  .card img,.card video{display:block;width:100%;max-height:70vh;object-fit:contain;background:#0001}
  .meta{padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
    font-family:system-ui,sans-serif;font-size:14px;color:var(--muted)}
  .meta strong{color:var(--ink);font-weight:600}
  .title{padding:14px 16px 0;font-weight:600;overflow-wrap:anywhere}
  .hint{padding:0 16px 14px;font:14px/1.4 system-ui,sans-serif;color:var(--muted)}
  .note{margin-top:40px;font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
  .chips{display:none;gap:8px;margin-top:12px;font-family:system-ui,sans-serif;font-size:15px}
  .chips label{display:flex;align-items:center;gap:8px;padding:8px 14px;border:1.5px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer}
  .chips input{flex:none;width:auto;padding:0;accent-color:var(--accent)}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 0;font-family:system-ui,sans-serif;font-size:15px}
  .bar label{display:flex;align-items:center;gap:8px;margin-right:auto}
  .bar input[type=checkbox],.item input{flex:none;width:22px;height:22px;padding:0;accent-color:var(--accent)}
  .list{max-height:60vh;overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:16px}
  .item{display:flex;gap:12px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);font:14px/1.35 system-ui,sans-serif;cursor:pointer}
  .item:last-child{border-bottom:0}
  .item img{width:96px;aspect-ratio:16/9;object-fit:cover;border-radius:6px;flex:none;background:#0002}
  .item span{overflow-wrap:anywhere}
  .pad{padding:8px 16px}
  progress{width:100%;height:10px;accent-color:var(--accent)}
  .listhead{font-weight:600;overflow-wrap:anywhere}
</style>
</head>
<body>
<main>
  <h1>Media<span>Saver</span></h1>
  <p class="lede">Paste a link from Pinterest, YouTube, Instagram, Facebook or X. For a YouTube channel or playlist, you can pick which videos or shorts to save.</p>

  <form class="row" id="form">
    <input id="url" type="url" inputmode="url" placeholder="Paste a link" required autocomplete="off">
    <button id="go" type="submit">Get media</button>
  </form>
  <div class="chips" id="tabs">
    <label><input type="radio" name="tab" value="videos" checked> Videos</label>
    <label><input type="radio" name="tab" value="shorts"> Shorts</label>
  </div>
  <div class="err" id="err" role="alert"></div>
  <section id="result" aria-live="polite"></section>

  <p class="note">Only save content you own or have permission to use. Content belongs to its creators, and each platform's terms apply.</p>
</main>

<script>
const $ = (id) => document.getElementById(id);
const pinDl = (file, name) => `/api/download?file=${encodeURIComponent(file)}&name=${encodeURIComponent(name)}`;
const ytDl = (url, q, name) => `/api/ytdl?url=${encodeURIComponent(url)}&q=${q}&name=${encodeURIComponent(name)}`;
const el = (tag, props = {}, ...kids) => {
  const n = Object.assign(document.createElement(tag), props);
  kids.forEach((k) => n.append(k));
  return n;
};

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("err").textContent = ""; $("result").style.display = "none";
  $("go").disabled = true; $("go").textContent = "Fetching…";
  const link = $("url").value.trim();
  try {
    if (listKind(link)) { await loadList(link); return; }
    const r = await fetch("/api/resolve?url=" + encodeURIComponent(link));
    const data = await r.json();
    if (!r.ok) throw new Error(data.error);
    data.kind === "ytdlp" ? renderYt(data, link) : renderPin(data);
  } catch (ex) {
    $("err").textContent = ex.message;
  } finally {
    $("go").disabled = false; $("go").textContent = "Get media";
  }
});

// ----- YouTube channel / playlist mode -----
function listKind(link) {
  try {
    const u = new URL(link);
    if (!/(^|\.)youtube\.com$/.test(u.hostname)) return null;
    if (/^\/(@|channel\/|c\/|user\/)/.test(u.pathname)) return "channel";
    if (u.pathname === "/playlist" && u.searchParams.get("list")) return "playlist";
  } catch {}
  return null;
}
$("url").addEventListener("input", () => {
  $("tabs").style.display = listKind($("url").value.trim()) === "channel" ? "flex" : "none";
});

async function loadList(link) {
  const tab = document.querySelector("input[name=tab]:checked").value;
  const r = await fetch(`/api/list?url=${encodeURIComponent(link)}&tab=${tab}`);
  const d = await r.json();
  if (!r.ok) throw new Error(d.error);
  if (!d.entries.length) throw new Error("No videos found in this tab.");
  renderList(d);
}

const fmtDur = (s) => (s ? `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}` : "");

function renderList(d) {
  const sel = new Set();
  const boxes = [];
  const all = el("input", { type: "checkbox" });
  const qSel = el("select", { ariaLabel: "Quality" },
    ...[["best", "Best"], ["1080", "1080p"], ["720", "720p"], ["480", "480p"], ["360", "360p"], ["audio", "Audio (MP3)"]]
      .map(([v, l]) => el("option", { value: v, textContent: l })));
  const go = el("button", { textContent: "Download selected (0)", disabled: true });
  const prog = el("div", { className: "card" });
  prog.style.display = "none";

  const sync = () => {
    all.checked = sel.size === d.entries.length;
    go.textContent = `Download selected (${sel.size})`;
    go.disabled = sel.size === 0;
  };
  all.addEventListener("change", () => {
    boxes.forEach((b) => { b.checked = all.checked; all.checked ? sel.add(b.value) : sel.delete(b.value); });
    sync();
  });

  const items = d.entries.map((e) => {
    const cb = el("input", { type: "checkbox", value: e.id });
    boxes.push(cb);
    cb.addEventListener("change", () => { cb.checked ? sel.add(e.id) : sel.delete(e.id); sync(); });
    return el("label", { className: "item" }, cb,
      el("img", { src: e.thumb, alt: "", loading: "lazy", referrerPolicy: "no-referrer" }),
      el("span", { textContent: e.title + (e.duration ? " · " + fmtDur(e.duration) : "") }));
  });

  const lock = (on) => { go.disabled = on || sel.size === 0; all.disabled = on; qSel.disabled = on; boxes.forEach((b) => (b.disabled = on)); };

  go.addEventListener("click", async () => {
    $("err").textContent = "";
    lock(true);
    try {
      const r = await fetch("/api/batch", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ids: [...sel], q: qSel.value }) });
      const j = await r.json();
      if (!r.ok) throw new Error(j.error);
      poll(j.id, prog, () => lock(false));
    } catch (ex) {
      $("err").textContent = ex.message;
      lock(false);
    }
  });

  const head = el("div", { className: "listhead", textContent: `${d.title} — ${d.count} ${d.tab === "shorts" ? "shorts" : "videos"}` });
  const note = d.capped ? el("div", { className: "hint", textContent: "Showing the first 1000 items." }) : "";
  show([head, note,
    el("div", { className: "bar" }, el("label", {}, all, `Select all (${d.count})`), qSel, go),
    el("div", { className: "list" }, ...items),
    prog]);
}

function poll(id, box, onEnd) {
  const bar = el("progress", { max: 1, value: 0 });
  const txt = el("div", { className: "hint" });
  const stop = el("button", { textContent: "Cancel" });
  stop.addEventListener("click", () => fetch("/api/batch/cancel?id=" + id));
  box.style.display = "block";
  box.replaceChildren(el("div", { className: "title", textContent: "Saving to your device" }),
    el("div", { className: "pad" }, bar), txt, el("div", { className: "pad" }, stop));

  const tick = async () => {
    try {
      const s = await (await fetch("/api/batch/status?id=" + id)).json();
      if (s.error) { txt.textContent = s.error; stop.remove(); return onEnd(); }
      bar.max = s.total; bar.value = s.done + s.failed;
      const base = `Saved ${s.done} of ${s.total}` + (s.failed ? ` · ${s.failed} failed` : "");
      if (s.status === "running") {
        txt.textContent = base + (s.current ? ` — now: ${s.current}` : "");
        return setTimeout(tick, 2000);
      }
      txt.textContent = (s.status === "cancelled" ? "Cancelled. " : "Done. ") + base +
        (s.errors.length ? `. Last error: ${s.errors[s.errors.length - 1]}` : "") + `. Files are in: ${s.saveDir}`;
      stop.remove(); onEnd();
    } catch { setTimeout(tick, 4000); }
  };
  tick();
}

function show(nodes) {
  $("result").replaceChildren(...nodes);
  $("result").style.display = "block";
}

function renderYt(d, link) {
  const opts = [["best", "Best available"]];
  [2160, 1440, 1080, 720, 480, 360].forEach((h) => { if (d.heights.includes(h)) opts.push([String(h), h + "p"]); });
  opts.push(["audio", "Audio only (MP3)"]);

  const select = el("select", { ariaLabel: "Quality" }, ...opts.map(([v, l]) => el("option", { value: v, textContent: l })));
  const dl = el("a", { className: "dl", textContent: "Download" });
  const setHref = () => (dl.href = ytDl(link, select.value, d.title));
  select.addEventListener("change", setHref); setHref();
  dl.addEventListener("click", () => {
    dl.textContent = "Preparing… keep this page open";
    setTimeout(() => (dl.textContent = "Download"), 20000);
  });

  const mins = d.duration ? ` · ${Math.floor(d.duration / 60)}:${String(Math.floor(d.duration % 60)).padStart(2, "0")}` : "";
  const card = el("div", { className: "card" },
    d.thumbnail ? el("img", { src: d.thumbnail, alt: "Thumbnail", referrerPolicy: "no-referrer" }) : "",
    el("div", { className: "title", textContent: d.title }),
    el("div", { className: "hint", textContent: (d.uploader || "") + mins + " — large files can take a minute to prepare." }),
    el("div", { className: "meta" }, select, dl)
  );
  show([card]);
}

function renderPin(d) {
  const base = (d.title || "pin").slice(0, 40) || "pin";
  const nodes = [];
  if (d.videos.length) {
    const best = d.videos[0];
    nodes.push(el("div", { className: "card" },
      el("video", { src: best, controls: true, playsInline: true, poster: d.images[0] || "" }),
      el("div", { className: "meta" }, el("span", { textContent: "Video · best available quality" }),
        el("a", { className: "dl", href: pinDl(best, base), textContent: "Download video" }))));
  }
  if (d.images.length) {
    const img = d.images[0];
    nodes.push(el("div", { className: "card" },
      el("img", { src: img, alt: "Pin preview", referrerPolicy: "no-referrer" }),
      el("div", { className: "meta" }, el("span", { textContent: (d.videos.length ? "Cover image" : "Image") + " · original size" }),
        el("a", { className: "dl", href: pinDl(img, base), textContent: "Download image" }))));
  }
  show(nodes);
}
</script>
</body>
</html>
