<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Saver — download videos and images</title>
<style>
  :root{
    --paper:#f3efe8; --ink:#1d1a17; --muted:#6f675e; --line:#d9d2c6;
    --accent:#c8102e; --accent-ink:#fff; --card:#fbf9f5;
  }
  @media (prefers-color-scheme: dark){
    :root{ --paper:#17140f; --ink:#f1ece3; --muted:#9a9187; --line:#332e26; --card:#1f1b15; --accent:#e8445b; }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font:17px/1.55 "Iowan Old Style","Palatino Linotype",Georgia,serif;}
  main{max-width:640px;margin:0 auto;padding:48px 20px 80px}
  h1{font-size:clamp(2.4rem,9vw,3.6rem);line-height:1;margin:0 0 12px;letter-spacing:-.02em;font-weight:700}
  h1 span{color:var(--accent)}
  .lede{color:var(--muted);margin:0 0 32px;max-width:48ch}
  .row{display:flex;gap:8px}
  input,select{flex:1;min-width:0;padding:14px 16px;font:inherit;font-size:16px;color:var(--ink);
    background:var(--card);border:1.5px solid var(--line);border-radius:10px}
  select{flex:0 1 auto;padding:12px}
  input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  button,.dl{font:600 16px/1 system-ui,sans-serif;padding:14px 20px;border:0;border-radius:10px;
    background:var(--accent);color:var(--accent-ink);cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
  button:disabled{opacity:.6;cursor:wait}
  .err{margin-top:16px;color:var(--accent);font-family:system-ui,sans-serif;font-size:15px}
  #result{margin-top:32px;display:none}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:16px}
  .card img,.card video{display:block;width:100%;max-height:70vh;object-fit:contain;background:#0001}
  .meta{padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
    font-family:system-ui,sans-serif;font-size:14px;color:var(--muted)}
  .meta strong{color:var(--ink);font-weight:600}
  .title{padding:14px 16px 0;font-weight:600;overflow-wrap:anywhere}
  .hint{padding:0 16px 14px;font:14px/1.4 system-ui,sans-serif;color:var(--muted)}
  .note{margin-top:40px;font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<main>
  <h1>Media<span>Saver</span></h1>
  <p class="lede">Paste a link from Pinterest, YouTube, Instagram, Facebook or X. Pick a quality and download.</p>

  <form class="row" id="form">
    <input id="url" type="url" inputmode="url" placeholder="Paste a link" required autocomplete="off">
    <button id="go" type="submit">Get media</button>
  </form>
  <div class="err" id="err" role="alert"></div>
  <section id="result" aria-live="polite"></section>

  <p class="note">Only save content you own or have permission to use. Content belongs to its creators, and each platform's terms apply.</p>
</main>

<script>
const $ = (id) => document.getElementById(id);
const pinDl = (file, name) => `/api/download?file=${encodeURIComponent(file)}&name=${encodeURIComponent(name)}`;
const ytDl = (url, q, name) => `/api/ytdl?url=${encodeURIComponent(url)}&q=${q}&name=${encodeURIComponent(name)}`;
const el = (tag, props = {}, ...kids) => {
  const n = Object.assign(document.createElement(tag), props);
  kids.forEach((k) => n.append(k));
  return n;
};

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("err").textContent = ""; $("result").style.display = "none";
  $("go").disabled = true; $("go").textContent = "Fetching…";
  const link = $("url").value.trim();
  try {
    const r = await fetch("/api/resolve?url=" + encodeURIComponent(link));
    const data = await r.json();
    if (!r.ok) throw new Error(data.error);
    data.kind === "ytdlp" ? renderYt(data, link) : renderPin(data);
  } catch (ex) {
    $("err").textContent = ex.message;
  } finally {
    $("go").disabled = false; $("go").textContent = "Get media";
  }
});

function show(nodes) {
  $("result").replaceChildren(...nodes);
  $("result").style.display = "block";
}

function renderYt(d, link) {
  const opts = [["best", "Best available"]];
  [2160, 1440, 1080, 720, 480, 360].forEach((h) => { if (d.heights.includes(h)) opts.push([String(h), h + "p"]); });
  opts.push(["audio", "Audio only (MP3)"]);

  const select = el("select", { ariaLabel: "Quality" }, ...opts.map(([v, l]) => el("option", { value: v, textContent: l })));
  const dl = el("a", { className: "dl", textContent: "Download" });
  const setHref = () => (dl.href = ytDl(link, select.value, d.title));
  select.addEventListener("change", setHref); setHref();
  dl.addEventListener("click", () => {
    dl.textContent = "Preparing… keep this page open";
    setTimeout(() => (dl.textContent = "Download"), 20000);
  });

  const mins = d.duration ? ` · ${Math.floor(d.duration / 60)}:${String(Math.floor(d.duration % 60)).padStart(2, "0")}` : "";
  const card = el("div", { className: "card" },
    d.thumbnail ? el("img", { src: d.thumbnail, alt: "Thumbnail", referrerPolicy: "no-referrer" }) : "",
    el("div", { className: "title", textContent: d.title }),
    el("div", { className: "hint", textContent: (d.uploader || "") + mins + " — large files can take a minute to prepare." }),
    el("div", { className: "meta" }, select, dl)
  );
  show([card]);
}

function renderPin(d) {
  const base = (d.title || "pin").slice(0, 40) || "pin";
  const nodes = [];
  if (d.videos.length) {
    const best = d.videos[0];
    nodes.push(el("div", { className: "card" },
      el("video", { src: best, controls: true, playsInline: true, poster: d.images[0] || "" }),
      el("div", { className: "meta" }, el("span", { textContent: "Video · best available quality" }),
        el("a", { className: "dl", href: pinDl(best, base), textContent: "Download video" }))));
  }
  if (d.images.length) {
    const img = d.images[0];
    nodes.push(el("div", { className: "card" },
      el("img", { src: img, alt: "Pin preview", referrerPolicy: "no-referrer" }),
      el("div", { className: "meta" }, el("span", { textContent: (d.videos.length ? "Cover image" : "Image") + " · original size" }),
        el("a", { className: "dl", href: pinDl(img, base), textContent: "Download image" }))));
  }
  show(nodes);
}
</script>
</body>
</html>
